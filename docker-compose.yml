# Local development only. The production stack described in
# architecture.md §3 belongs under deploy/ and is intentionally separate.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nmp
      POSTGRES_USER: nmp
      POSTGRES_PASSWORD: nmp_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nmp -d nmp']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: nuestra-medicina-personal-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['migrate']
    environment:
      DATABASE_URL: postgres://nmp:nmp_dev_only@postgres:5432/nmp?sslmode=disable
      MIGRATIONS_PATH: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: nuestra-medicina-personal-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '8080:8080'
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:5173
      HTTP_ADDRESS: :8080
      HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-32768}
      HTTP_MAX_REQUEST_URI_BYTES: ${HTTP_MAX_REQUEST_URI_BYTES:-8192}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-10}
      RATE_LIMIT_ORDER_REQUESTS: ${RATE_LIMIT_ORDER_REQUESTS:-5}
      RATE_LIMIT_DOWNLOAD_REQUESTS: ${RATE_LIMIT_DOWNLOAD_REQUESTS:-30}
      RATE_LIMIT_ADMIN_WRITE_REQUESTS: ${RATE_LIMIT_ADMIN_WRITE_REQUESTS:-60}
      DATABASE_URL: postgres://nmp:nmp_dev_only@postgres:5432/nmp?sslmode=disable
      DATABASE_MAX_CONNECTIONS: 5
      ADMIN_GOOGLE_SUB: ${ADMIN_GOOGLE_SUB:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      SESSION_TTL: ${SESSION_TTL:-720h}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_PUBLIC_BASE_URL: ${MERCADOPAGO_PUBLIC_BASE_URL:-}
      # E2E-only override (see e2e/README.md) — empty means "use the real API".
      MERCADOPAGO_API_BASE_URL: ${MERCADOPAGO_API_BASE_URL:-}
      EBOOK_STORAGE_PATH: /data/ebooks
      EBOOK_INTERNAL_PREFIX: /_protected/ebooks
      EBOOK_MAX_UPLOAD_BYTES: ${EBOOK_MAX_UPLOAD_BYTES:-52428800}
      MEDIA_STORAGE_PATH: /data/media
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-10485760}
      GOOGLE_MAIL_SENDER: ${GOOGLE_MAIL_SENDER:-}
      GOOGLE_MAIL_CREDENTIALS_PATH: ${GOOGLE_MAIL_CREDENTIALS_PATH:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      EMAIL_WORKER_INTERVAL: ${EMAIL_WORKER_INTERVAL:-10s}
      EMAIL_LEASE_TIMEOUT: ${EMAIL_LEASE_TIMEOUT:-5m}
      EMAIL_BATCH_SIZE: ${EMAIL_BATCH_SIZE:-5}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
    volumes:
      - ebooks_data:/data/ebooks
      - media_data:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8080/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_PROXY_TARGET: http://api:8080
    depends_on:
      - api

volumes:
  postgres_data:
  ebooks_data:
  media_data:
