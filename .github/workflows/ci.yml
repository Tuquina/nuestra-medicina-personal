name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nmp_test
          POSTGRES_USER: nmp
          POSTGRES_PASSWORD: nmp_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nmp -d nmp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nmp:nmp_ci_only@localhost:5432/nmp_test?sslmode=disable
      MIGRATIONS_PATH: ../migrations
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Unit tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Apply migrations
        run: go run ./cmd/migrate

      - name: PostgreSQL integration tests
        run: go test -tags=integration ./internal/infrastructure/postgres

      - name: Backup and restore smoke test
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp ../deploy/operations/backup.sh "$POSTGRES_CONTAINER:/tmp/backup.sh"
          docker cp ../deploy/operations/restore.sh "$POSTGRES_CONTAINER:/tmp/restore.sh"
          docker exec "$POSTGRES_CONTAINER" sh -c "mkdir -p /data/ebooks /data/media /backups /restore/ebooks /restore/media && printf ebook-fixture > /data/ebooks/book.epub && printf media-fixture > /data/media/cover.png"
          mkdir -p "$RUNNER_TEMP/concurrent-backups" "$RUNNER_TEMP/concurrent-ebooks" "$RUNNER_TEMP/concurrent-media"
          printf ebook-fixture > "$RUNNER_TEMP/concurrent-ebooks/book.epub"
          printf media-fixture > "$RUNNER_TEMP/concurrent-media/cover.png"
          run_isolated_backup() {
            docker run --rm \
              --network "container:$POSTGRES_CONTAINER" \
              --entrypoint sh \
              -e POSTGRES_HOST=127.0.0.1 \
              -e POSTGRES_DB=nmp_test \
              -e POSTGRES_USER=nmp \
              -e POSTGRES_PASSWORD=nmp_ci_only \
              -v "$GITHUB_WORKSPACE/deploy/operations/backup.sh:/tmp/backup.sh:ro" \
              -v "$RUNNER_TEMP/concurrent-backups:/backups" \
              -v "$RUNNER_TEMP/concurrent-ebooks:/data/ebooks:ro" \
              -v "$RUNNER_TEMP/concurrent-media:/data/media:ro" \
              postgres:17-alpine /tmp/backup.sh
          }
          run_isolated_backup > "$RUNNER_TEMP/backup-1.txt" &
          BACKUP_PID_1=$!
          run_isolated_backup > "$RUNNER_TEMP/backup-2.txt" &
          BACKUP_PID_2=$!
          wait "$BACKUP_PID_1" "$BACKUP_PID_2"
          test "$(sort -u "$RUNNER_TEMP/backup-1.txt" "$RUNNER_TEMP/backup-2.txt" | wc -l)" -eq 2
          test "$(find "$RUNNER_TEMP/concurrent-backups" -maxdepth 1 -type f -name 'nmp-backup-*.tar.gz' | wc -l)" -eq 2
          docker exec \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_DB=nmp_test \
            -e POSTGRES_USER=nmp \
            -e POSTGRES_PASSWORD=nmp_ci_only \
            "$POSTGRES_CONTAINER" sh /tmp/backup.sh
          RESTORE_ARCHIVE="$(docker exec "$POSTGRES_CONTAINER" sh -c 'basename "$(ls -1 /backups/nmp-backup-*.tar.gz | tail -n 1)"')"
          docker exec -e PGPASSWORD=nmp_ci_only "$POSTGRES_CONTAINER" createdb --host 127.0.0.1 --username nmp nmp_restore
          docker exec \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_DB=nmp_restore \
            -e POSTGRES_USER=nmp \
            -e POSTGRES_PASSWORD=nmp_ci_only \
            -e EBOOK_STORAGE_PATH=/restore/ebooks \
            -e MEDIA_STORAGE_PATH=/restore/media \
            -e RESTORE_ARCHIVE="$RESTORE_ARCHIVE" \
            -e RESTORE_CONFIRM=restore-into-empty-targets \
            "$POSTGRES_CONTAINER" sh /tmp/restore.sh
          test "$(docker exec -e PGPASSWORD=nmp_ci_only "$POSTGRES_CONTAINER" psql --host 127.0.0.1 --username nmp --dbname nmp_restore --tuples-only --no-align --command "SELECT count(*) FROM schema_migrations;")" -gt 0
          test "$(docker exec "$POSTGRES_CONTAINER" cat /restore/ebooks/book.epub)" = "ebook-fixture"
          test "$(docker exec "$POSTGRES_CONTAINER" cat /restore/media/cover.png)" = "media-fixture"
          if docker exec \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_DB=nmp_restore \
            -e POSTGRES_USER=nmp \
            -e POSTGRES_PASSWORD=nmp_ci_only \
            -e EBOOK_STORAGE_PATH=/restore/ebooks \
            -e MEDIA_STORAGE_PATH=/restore/media \
            -e RESTORE_ARCHIVE="$RESTORE_ARCHIVE" \
            -e RESTORE_CONFIRM=restore-into-empty-targets \
            "$POSTGRES_CONTAINER" sh /tmp/restore.sh; then
            echo "restore unexpectedly accepted non-empty targets" >&2
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  contracts:
    name: Contracts and Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate OpenAPI
        run: ruby scripts/validate-openapi.rb docs/openapi.yaml

      - name: Validate development Compose
        run: docker compose config --quiet

      - name: Validate production Compose
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet

  images:
    name: Docker image · ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: backend/Dockerfile
          - image: web
            dockerfile: deploy/nginx/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: nuestra-medicina-personal-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
