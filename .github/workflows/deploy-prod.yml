name: Deploy · production

# Runs whenever main moves (develop -> main PR merged — see docs/ci.md's
# branch flow). Actually deploying still waits for manual approval: add a
# required reviewer to the "production" GitHub Environment (Settings ->
# Environments -> production) and this job pauses there until approved.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      stack_name: prod
    secrets: inherit
