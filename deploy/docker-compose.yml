x-logging: &default-logging
  driver: local
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

x-database-operation: &database-operation
  image: postgres:17-alpine
  profiles: [operations]
  restart: 'no'
  logging: *default-logging
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    BACKUP_DIR: /backups
    BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-0}
    EBOOK_STORAGE_PATH: /data/ebooks
    MEDIA_STORAGE_PATH: /data/media
    RESTORE_ARCHIVE: ${RESTORE_ARCHIVE:-}
    RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${BACKEND_IMAGE}
    command: ['migrate']
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATIONS_PATH: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *default-logging

  api:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: production
      APP_BASE_URL: https://${APP_DOMAIN}
      HTTP_ADDRESS: :8080
      HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-32768}
      HTTP_MAX_REQUEST_URI_BYTES: ${HTTP_MAX_REQUEST_URI_BYTES:-8192}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-10}
      RATE_LIMIT_ORDER_REQUESTS: ${RATE_LIMIT_ORDER_REQUESTS:-5}
      RATE_LIMIT_DOWNLOAD_REQUESTS: ${RATE_LIMIT_DOWNLOAD_REQUESTS:-30}
      RATE_LIMIT_ADMIN_WRITE_REQUESTS: ${RATE_LIMIT_ADMIN_WRITE_REQUESTS:-60}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-5}
      ADMIN_GOOGLE_SUBS: ${ADMIN_GOOGLE_SUBS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://${APP_DOMAIN}/api/v1/auth/google/callback
      SESSION_TTL: ${SESSION_TTL:-720h}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
      # Driven from .env, not derived from APP_DOMAIN like GOOGLE_REDIRECT_URL
      # above — config.go requires all three Mercado Pago variables empty or
      # all three set (unlike Google's, whose validation tolerates the
      # redirect URL being set alone). Hardcoding this to a non-empty value
      # would make it impossible to ever start without Mercado Pago
      # configured, even to bootstrap a brand new environment.
      MERCADOPAGO_PUBLIC_BASE_URL: ${MERCADOPAGO_PUBLIC_BASE_URL:-}
      EBOOK_STORAGE_PATH: /data/ebooks
      EBOOK_INTERNAL_PREFIX: /_protected/ebooks
      EBOOK_MAX_UPLOAD_BYTES: ${EBOOK_MAX_UPLOAD_BYTES:-52428800}
      MEDIA_STORAGE_PATH: /data/media
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-10485760}
      GOOGLE_MAIL_SENDER: ${GOOGLE_MAIL_SENDER}
      # Driven from .env, same reasoning as MERCADOPAGO_PUBLIC_BASE_URL above
      # — config.go requires this and GOOGLE_MAIL_SENDER empty together or
      # set together. When Gmail is configured, set this in .env to
      # /run/secrets/gmail-service-account.json (the path the `secrets:`
      # block below mounts it at, via the `target:` set on the api service).
      GOOGLE_MAIL_CREDENTIALS_PATH: ${GOOGLE_MAIL_CREDENTIALS_PATH:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      EMAIL_WORKER_INTERVAL: ${EMAIL_WORKER_INTERVAL:-10s}
      EMAIL_LEASE_TIMEOUT: ${EMAIL_LEASE_TIMEOUT:-5m}
      EMAIL_BATCH_SIZE: ${EMAIL_BATCH_SIZE:-5}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
    volumes:
      - ebooks_data:/data/ebooks
      - media_data:/data/media
    secrets:
      # Compose's short form mounts a secret at /run/secrets/<secret-name>
      # (i.e. /run/secrets/gmail_service_account) — this app hardcodes
      # GOOGLE_MAIL_CREDENTIALS_PATH to /run/secrets/gmail-service-account.json
      # above, so the target must be set explicitly to match, or the API
      # crash-loops the instant real Gmail credentials are configured.
      - source: gmail_service_account
        target: gmail-service-account.json
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8080/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVER_NAME: ${APP_DOMAIN}
      EBOOK_CLIENT_MAX_BODY_SIZE: ${EBOOK_CLIENT_MAX_BODY_SIZE:-51m}
    volumes:
      - ebooks_data:/data/ebooks:ro
    networks:
      default:
      edge:
        # deploy/proxy/'s Caddy reaches this stack's nginx by this alias —
        # STACK_NAME (e.g. "prod"/"dev") is what keeps two instances of
        # this same compose file addressable on the shared edge network.
        # Nothing else in this stack joins `edge`; api/postgres stay
        # reachable only from within this project's own default network.
        aliases:
          - nginx-${STACK_NAME}
    depends_on:
      api:
        condition: service_healthy

  backup:
    <<: *database-operation
    command: ['/bin/sh', '/opt/operations/backup.sh']
    volumes:
      - ebooks_data:/data/ebooks:ro
      - media_data:/data/media:ro
      - ${BACKUP_PATH}:/backups
      - ./operations:/opt/operations:ro

  restore:
    <<: *database-operation
    command: ['/bin/sh', '/opt/operations/restore.sh']
    volumes:
      - ebooks_data:/data/ebooks
      - media_data:/data/media
      - ${BACKUP_PATH}:/backups
      - ./operations:/opt/operations:ro

volumes:
  postgres_data:
  ebooks_data:
  media_data:

networks:
  # Created once on the host with `docker network create edge` (see
  # deploy/README.md) — shared by every environment's nginx and by
  # deploy/proxy/'s Caddy, so Caddy can reach each stack's nginx without
  # any of them publishing ports directly.
  edge:
    external: true

secrets:
  gmail_service_account:
    file: ${GOOGLE_MAIL_CREDENTIALS_FILE}
