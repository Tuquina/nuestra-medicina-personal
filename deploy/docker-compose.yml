services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${BACKEND_IMAGE}
    command: ['migrate']
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATIONS_PATH: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_BASE_URL: https://${APP_DOMAIN}
      HTTP_ADDRESS: :8080
      HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-32768}
      HTTP_MAX_REQUEST_URI_BYTES: ${HTTP_MAX_REQUEST_URI_BYTES:-8192}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-10}
      RATE_LIMIT_ORDER_REQUESTS: ${RATE_LIMIT_ORDER_REQUESTS:-5}
      RATE_LIMIT_DOWNLOAD_REQUESTS: ${RATE_LIMIT_DOWNLOAD_REQUESTS:-30}
      RATE_LIMIT_ADMIN_WRITE_REQUESTS: ${RATE_LIMIT_ADMIN_WRITE_REQUESTS:-60}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-5}
      ADMIN_GOOGLE_SUB: ${ADMIN_GOOGLE_SUB}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://${APP_DOMAIN}/api/v1/auth/google/callback
      SESSION_TTL: ${SESSION_TTL:-720h}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
      MERCADOPAGO_PUBLIC_BASE_URL: https://${APP_DOMAIN}
      EBOOK_STORAGE_PATH: /data/ebooks
      EBOOK_INTERNAL_PREFIX: /_protected/ebooks
      EBOOK_MAX_UPLOAD_BYTES: ${EBOOK_MAX_UPLOAD_BYTES:-52428800}
      MEDIA_STORAGE_PATH: /data/media
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-10485760}
      GOOGLE_MAIL_SENDER: ${GOOGLE_MAIL_SENDER}
      GOOGLE_MAIL_CREDENTIALS_PATH: /run/secrets/gmail-service-account.json
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      EMAIL_WORKER_INTERVAL: ${EMAIL_WORKER_INTERVAL:-10s}
      EMAIL_LEASE_TIMEOUT: ${EMAIL_LEASE_TIMEOUT:-5m}
      EMAIL_BATCH_SIZE: ${EMAIL_BATCH_SIZE:-5}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
    volumes:
      - ebooks_data:/data/ebooks
      - media_data:/data/media
    secrets:
      - gmail_service_account
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8080/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      SERVER_NAME: ${APP_DOMAIN}
      EBOOK_CLIENT_MAX_BODY_SIZE: ${EBOOK_CLIENT_MAX_BODY_SIZE:-51m}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ebooks_data:/data/ebooks:ro
      - ${TLS_CERTIFICATE_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  ebooks_data:
  media_data:

secrets:
  gmail_service_account:
    file: ${GOOGLE_MAIL_CREDENTIALS_FILE}
