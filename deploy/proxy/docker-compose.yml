# The single public entry point on the VPS — the only thing that ever
# publishes ports 80/443. Terminates TLS (automatic Let's Encrypt
# certificates, auto-renewed) for every environment stack running on this
# host and reverse-proxies to each one's nginx over the shared `edge`
# network. See ../README.md and docs/decisions/0005-*.md.
#
# Brought up once, independently of the app stacks:
#   docker network create edge   # once, ever
#   docker compose --env-file deploy/proxy/.env -f deploy/proxy/docker-compose.yml up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: 5
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
      DEV_DOMAIN: ${DEV_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
