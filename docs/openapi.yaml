        q: {type: string, maxLength: 300}
        a: {type: string, maxLength: 2000}
    PageCreateInput:
      type: object
      additionalProperties: false
      required: [type, slug, title]
      properties:
        type: {$ref: '#/components/schemas/PageType'}
        bookId: {type: [string, 'null'], format: uuid}
        slug: {type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        title: {type: string, minLength: 1, maxLength: 200}
        content: {$ref: '#/components/schemas/PageContent'}
    PublishedPage:
      type: object
      required: [id, type, bookId, slug, title, content, publishedAt]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/PageType'}
        bookId: {type: [string, 'null'], format: uuid}
        slug: {type: string}
        title: {type: string}
        content: {$ref: '#/components/schemas/PageContent'}
        publishedAt: {type: [string, 'null'], format: date-time}
    AdminPage:
      type: object
      required: [id, type, bookId, slug, title, status, draftContent, publishedContent, createdAt, updatedAt, publishedAt]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/PageType'}
        bookId: {type: [string, 'null'], format: uuid}
        slug: {type: string}
