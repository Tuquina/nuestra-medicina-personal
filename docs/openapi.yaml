        fileSize: {type: string, maxLength: 2000}
        faqs: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/BookLandingFAQ'}}
        relatedSlug: {type: string, pattern: '^(?:[a-z0-9]+(?:-[a-z0-9]+)*)?$'}
        ctaGlowSide: {type: string, enum: [left, right]}
