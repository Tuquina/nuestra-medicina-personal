      required: [id, originalFilename, mimeType, sizeBytes, width, height, url, createdAt]
      properties:
        id: {type: string, format: uuid}
        originalFilename: {type: string}
        mimeType: {type: string, enum: [image/jpeg, image/png]}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        width: {type: integer, minimum: 1, maximum: 8000}
        height: {type: integer, minimum: 1, maximum: 8000}
        url: {type: string}
        createdAt: {type: string, format: date-time}
    MediaList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MediaAsset'}
        total: {type: integer, minimum: 0}
    CouponInput:
      type: object
      additionalProperties: false
      required: [code, kind, value, currency, startsAt, endsAt, usageLimit, appliesToAll, bookIds, active]
      properties:
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]*$', maxLength: 80}
        kind: {type: string, enum: [PERCENTAGE, FIXED]}
        value: {type: integer, format: int64, minimum: 1, description: Porcentaje entero o unidades menores para FIXED.}
        currency: {type: string, minLength: 3, maxLength: 3}
        startsAt: {type: string, format: date}
        endsAt: {type: string, format: date}
        usageLimit: {type: [integer, 'null'], minimum: 1}
        appliesToAll: {type: boolean}
        bookIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        active: {type: boolean}
    Coupon:
      allOf:
        - $ref: '#/components/schemas/CouponInput'
        - type: object
          required: [id, usageCount, status, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            usageCount: {type: integer, minimum: 0}
            status: {type: string, enum: [ACTIVE, SCHEDULED, EXPIRED, INACTIVE]}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
