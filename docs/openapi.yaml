      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [APPROVED, REJECTED]}
    Review:
      type: object
      required: [id, bookId, bookSlug, bookTitle, customerName, rating, body, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        bookId: {type: string, format: uuid}
        bookSlug: {type: string}
        bookTitle: {type: string}
        customerName: {type: string}
        rating: {type: integer, minimum: 1, maximum: 5}
        body: {type: string}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ReviewList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Review'}}
        total: {type: integer, minimum: 0}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string}
            message: {type: string}
            details: {}
  responses:
    RateLimitExceeded:
      description: La identidad superó la cuota de esta operación durante la ventana vigente.
      headers:
        Retry-After:
          description: Segundos hasta que la operación puede volver a intentarse.
          schema: {type: integer, minimum: 1}
        X-RateLimit-Limit:
          description: Solicitudes permitidas por ventana.
          schema: {type: integer, minimum: 1}
        X-RateLimit-Remaining:
          description: Solicitudes restantes en la ventana actual.
          schema: {type: integer, minimum: 0}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    DatabaseUnavailable:
      description: PostgreSQL no está disponible.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AuthenticationRequired:
      description: Falta una sesión válida.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AdminRequired:
      description: La sesión no corresponde al administrador.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BookNotFound:
      description: El libro no existe o no está publicado en una ruta pública.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BookConflict:
      description: El slug ya pertenece a otro libro o se intentó publicar sin una landing CMS publicada.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BookValidationFailed:
      description: Los datos del libro no cumplen el contrato.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PageNotFound:
      description: La página no existe o no está publicada en una ruta pública.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PageValidationFailed:
      description: La página o alguno de sus bloques no cumple el contrato seguro.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    MediaNotFound:
      description: La imagen no existe.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BackofficeQueryInvalid:
      description: Algún filtro, rango o valor de paginación es inválido.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
