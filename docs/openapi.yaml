openapi: 3.1.0
info:
  title: Nuestra Medicina Personal API
  version: 0.1.0
  description: API REST del monolito para la tienda personal de eBooks.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Health
  - name: Authentication
  - name: Books
  - name: Orders
  - name: Library
  - name: Pages
  - name: Media
  - name: Webhooks
  - name: Admin books
  - name: Admin pages
  - name: Admin media
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        '200':
          description: El proceso HTTP está vivo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        '200':
          description: La API puede acceder a PostgreSQL.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
  /api/v1/auth/google:
    get:
      tags: [Authentication]
      operationId: startGoogleAuthentication
      description: Inicia Authorization Code con PKCE, state y nonce.
      responses:
        '302': {description: Redirección al endpoint de autorización de Google.}
        '503':
          description: Las credenciales Google no están configuradas.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/auth/google/callback:
    get:
      tags: [Authentication]
      operationId: completeGoogleAuthentication
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302': {description: Sesión creada y redirección a la biblioteca, o regreso al login si el usuario canceló.}
        '400':
          description: State, nonce, PKCE o callback inválido/expirado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '502':
          description: No fue posible validar la identidad con Google.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': {description: Sesión revocada y cookie eliminada.}
        '403':
          description: Origin no permitido.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Usuario de la sesión vigente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/books:
    get:
      tags: [Books]
      operationId: listPublishedBooks
      description: Devuelve exclusivamente libros publicados.
      responses:
        '200':
          description: Catálogo público.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookList'}
  /api/v1/books/{slug}:
    parameters:
      - $ref: '#/components/parameters/BookSlug'
    get:
      tags: [Books]
      operationId: getPublishedBook
      description: Un borrador o libro archivado se responde como inexistente.
      responses:
        '200':
          description: Libro publicado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '404': {$ref: '#/components/responses/BookNotFound'}
  /api/v1/pages/{slug}:
    get:
      tags: [Pages]
      operationId: getPublishedPage
      description: Devuelve únicamente la versión publicada; nunca expone el borrador.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Página publicada.
          content: {application/json: {schema: {$ref: '#/components/schemas/PublishedPage'}}}
        '404': {$ref: '#/components/responses/PageNotFound'}
  /api/v1/media/{id}:
    get:
      tags: [Media]
      operationId: getMedia
      description: Sirve una imagen publicada por su UUID sin exponer el path físico.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Imagen con cache immutable.
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            image/jpeg: {}
            image/png: {}
        '404': {$ref: '#/components/responses/MediaNotFound'}
  /api/v1/me/books:
    get:
      tags: [Library]
      operationId: listPurchasedBooks
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Libros asociados a órdenes pagadas del usuario.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryBookList'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/books/{id}/download:
    get:
      tags: [Library]
      operationId: downloadPurchasedBook
      description: Autoriza la compra y delega el archivo a una ubicación interna de Nginx.
      security: [{sessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Descarga protegida resuelta internamente por Nginx.
          headers:
            Content-Disposition: {schema: {type: string}}
            X-Accel-Redirect: {schema: {type: string}}
          content:
            application/pdf: {}
            application/epub+zip: {}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404':
          description: El usuario no compró el libro o el archivo no está disponible.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      description: Crea una orden con precio histórico y una preferencia de Checkout Pro.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bookSlug]
              properties:
                bookSlug: {type: string}
      responses:
        '201':
          description: Orden pendiente con URL de Checkout Pro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '422':
          description: El libro no está publicado o no tiene precio válido.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503':
          description: Mercado Pago no está configurado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      security: [{sessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Orden perteneciente al usuario autenticado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404':
          description: Orden inexistente o perteneciente a otro usuario.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/webhooks/mercadopago:
    post:
      tags: [Webhooks]
      operationId: processMercadoPagoWebhook
      description: Valida x-signature y reconsulta el pago; no confía en el cuerpo recibido.
      parameters:
        - {name: data.id, in: query, required: true, schema: {type: string}}
        - {name: type, in: query, schema: {type: string, const: payment}}
        - {name: X-Signature, in: header, required: true, schema: {type: string}}
        - {name: X-Request-ID, in: header, required: true, schema: {type: string}}
      responses:
        '204': {description: Notificación procesada o pago ajeno ignorado de forma segura.}
        '401':
          description: Firma ausente, inválida o vencida.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '502':
          description: Fallo transitorio al consultar o persistir el pago.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/admin/books:
    get:
      tags: [Admin books]
      operationId: listAdminBooks
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Todos los libros, incluidos borradores y archivados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookList'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
    post:
      tags: [Admin books]
      operationId: createBook
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '201':
          description: Libro creado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/BookSlugConflict'}
        '422': {$ref: '#/components/responses/BookValidationFailed'}
  /api/v1/admin/books/{identifier}:
    parameters:
      - $ref: '#/components/parameters/BookIdentifier'
    get:
      tags: [Admin books]
      operationId: getAdminBook
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Libro por UUID o slug.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
    put:
      tags: [Admin books]
      operationId: updateBook
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '200':
          description: Libro actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '409': {$ref: '#/components/responses/BookSlugConflict'}
        '422': {$ref: '#/components/responses/BookValidationFailed'}
  /api/v1/admin/pages:
    post:
      tags: [Admin pages]
      operationId: createPage
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PageCreateInput'}}}
      responses:
        '201':
          description: Página creada como borrador.
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {description: El slug o destino de la página ya existe., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/PageValidationFailed'}
  /api/v1/admin/pages/{identifier}:
    get:
      tags: [Admin pages]
      operationId: getAdminPage
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
      responses:
        '200': {description: Página con borrador y publicación., content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/PageNotFound'}
  /api/v1/admin/pages/{identifier}/draft:
    put:
      tags: [Admin pages]
      operationId: savePageDraft
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: {$ref: '#/components/schemas/PageContent'}
      responses:
        '200': {description: Borrador guardado sin cambiar la publicación., content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/PageNotFound'}
        '422': {$ref: '#/components/responses/PageValidationFailed'}
  /api/v1/admin/pages/{identifier}/publish:
    post:
      tags: [Admin pages]
      operationId: publishPage
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200': {description: Borrador publicado como una nueva versión inmutable., content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/PageNotFound'}
  /api/v1/admin/pages/{identifier}/versions:
    get:
      tags: [Admin pages]
      operationId: listPageVersions
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
      responses:
        '200': {description: Historial descendente de publicaciones., content: {application/json: {schema: {$ref: '#/components/schemas/PageVersionList'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/PageNotFound'}
  /api/v1/admin/pages/{identifier}/versions/{versionId}/restore:
    post:
      tags: [Admin pages]
      operationId: restorePageVersion
      description: Copia una versión al borrador; no cambia el contenido público hasta volver a publicar.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
        - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Origin'
      responses:
        '200': {description: Versión restaurada como borrador., content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {description: Página o versión inexistente., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/admin/media:
    get:
      tags: [Admin media]
      operationId: listMedia
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Biblioteca multimedia., content: {application/json: {schema: {$ref: '#/components/schemas/MediaList'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
    post:
      tags: [Admin media]
      operationId: uploadMedia
      description: Valida extensión, MIME, contenido y dimensiones antes de guardar la imagen.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: Imagen guardada., content: {application/json: {schema: {$ref: '#/components/schemas/MediaAsset'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '413': {description: La imagen supera el límite configurado., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: El archivo no es una imagen JPEG/PNG válida., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/admin/media/{id}:
    delete:
      tags: [Admin media]
      operationId: deleteMedia
      description: Rechaza la eliminación si una portada o versión de página todavía referencia la imagen.
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': {description: Imagen y metadata eliminadas.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/MediaNotFound'}
        '409': {description: La imagen todavía está referenciada., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Admin books]
      operationId: archiveBook
      description: Cambia el estado a ARCHIVED; no elimina registros físicamente.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': {description: Libro archivado.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
  /api/v1/admin/books/{identifier}/ebook:
    parameters:
      - $ref: '#/components/parameters/BookIdentifier'
    put:
      tags: [Admin books]
      operationId: uploadBookEbook
      description: Reemplaza el archivo privado del libro después de validar extensión, MIME y contenido.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Archivo almacenado con una clave física opaca.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EbookUpload'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '413':
          description: El archivo supera el límite configurado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: El archivo no es un PDF o EPUB válido.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nmp_session
  parameters:
    BookSlug:
      name: slug
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    BookIdentifier:
      name: identifier
      in: path
      required: true
      description: UUID o slug del libro.
      schema: {type: string}
    PageIdentifier:
      name: identifier
      in: path
      required: true
      description: UUID o slug de la página.
      schema: {type: string}
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    BookStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    User:
      type: object
      required: [id, email, displayName, pictureUrl, isAdmin]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        pictureUrl: {type: string}
        isAdmin: {type: boolean}
    OrderStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED, EXPIRED]
    OrderItem:
      type: object
      required: [bookId, bookSlug, bookTitle, unitPriceMinorUnits, quantity, currency]
      properties:
        bookId: {type: string, format: uuid}
        bookSlug: {type: string}
        bookTitle: {type: string}
        unitPriceMinorUnits: {type: integer, format: int64, minimum: 0}
        quantity: {type: integer, minimum: 1}
        currency: {type: string, minLength: 3, maxLength: 3}
    Order:
      type: object
      required: [id, status, totalMinorUnits, currency, items, createdAt, updatedAt, paidAt]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/OrderStatus'}
        totalMinorUnits: {type: integer, format: int64, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3}
        checkoutUrl: {type: string, format: uri}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        paidAt: {type: [string, 'null'], format: date-time}
    BookInput:
      type: object
      additionalProperties: false
      required: [slug, title, priceMinorUnits]
      properties:
        slug: {type: string, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        title: {type: string, maxLength: 200}
        subtitle: {type: string}
        authorName: {type: string}
        category: {type: string}
        variant: {type: string, enum: [gold, blue], default: blue}
        shortDescription: {type: string, maxLength: 1000}
        priceMinorUnits: {type: integer, format: int64, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3, default: ARS}
        isbn: {type: string}
        publicationDate: {type: [string, 'null'], format: date}
        publicationDateLabel: {type: string}
        format: {type: string}
        fileSizeBytes: {type: [integer, 'null'], format: int64, minimum: 0}
        coverMediaId: {type: [string, 'null'], format: uuid}
        coverCaption: {type: string}
        status: {$ref: '#/components/schemas/BookStatus'}
        seoTitle: {type: string}
        seoDescription: {type: string}
        seoIndexable: {type: boolean, default: true}
    Book:
      allOf:
        - $ref: '#/components/schemas/BookInput'
        - type: object
          required: [id, status, hasCover, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            hasCover: {type: boolean}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            publishedAt: {type: [string, 'null'], format: date-time}
    BookList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Book'}
        total: {type: integer, minimum: 0}
    LibraryBook:
      type: object
      required: [id, slug, title, format, purchasedAt, downloadAvailable]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        coverMediaId: {type: [string, 'null'], format: uuid}
        format: {type: string}
        fileSizeBytes: {type: [integer, 'null'], format: int64, minimum: 0}
        purchasedAt: {type: string, format: date-time}
        downloadAvailable: {type: boolean}
    LibraryBookList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryBook'}
        total: {type: integer, minimum: 0}
    EbookUpload:
      type: object
      required: [bookId, filename, mediaType, sizeBytes]
      properties:
        bookId: {type: string, format: uuid}
        filename: {type: string}
        mediaType: {type: string, enum: [application/pdf, application/epub+zip]}
        sizeBytes: {type: integer, format: int64, minimum: 1}
    PageContent:
      type: object
      additionalProperties: false
      required: [schemaVersion, sections]
      properties:
        schemaVersion: {type: integer, const: 1}
        sections:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PageBlock'}
    PageBlock:
      type: object
      additionalProperties: false
      required: [id, type, props]
      properties:
        id: {type: string, minLength: 1, maxLength: 100}
        type: {type: string, enum: [hero, richText, imageText, features, faq, cta, buyButton]}
        props:
          oneOf:
            - $ref: '#/components/schemas/HeroProps'
            - $ref: '#/components/schemas/RichTextProps'
            - $ref: '#/components/schemas/ImageTextProps'
            - $ref: '#/components/schemas/FeaturesProps'
            - $ref: '#/components/schemas/FAQProps'
            - $ref: '#/components/schemas/CTAProps'
            - $ref: '#/components/schemas/BuyButtonProps'
    SafeLink:
      type: object
      additionalProperties: false
      required: [label, href]
      properties:
        label: {type: string, minLength: 1, maxLength: 80}
        href:
          type: string
          minLength: 1
          maxLength: 2000
          description: Ruta relativa o URL con esquema http/https; javascript y otros esquemas se rechazan.
    HeroProps:
      type: object
      additionalProperties: false
      required: [title, subtitle, imageId, alignment, cta]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        subtitle: {type: string, maxLength: 500}
        imageId: {type: [string, 'null']}
        alignment: {type: string, enum: [left, center]}
        cta:
          oneOf:
            - $ref: '#/components/schemas/SafeLink'
            - {type: 'null'}
    RichTextProps:
      type: object
      additionalProperties: false
      required: [nodes]
      properties:
        nodes:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: '#/components/schemas/RichTextNode'}
    RichTextNode:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [paragraph, heading, bulletList, orderedList]}
        level: {type: integer, minimum: 2, maximum: 4}
        content:
          type: array
          items: {$ref: '#/components/schemas/RichTextSpan'}
        items:
          type: array
          items:
            type: array
            items: {$ref: '#/components/schemas/RichTextSpan'}
    RichTextSpan:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
        marks:
          type: array
          uniqueItems: true
          items: {type: string, enum: [bold, italic]}
        link:
          type: [string, 'null']
          description: Ruta relativa o URL http/https.
    ImageTextProps:
      type: object
      additionalProperties: false
      required: [heading, text, imageId, imagePosition]
      properties:
        heading: {type: string, minLength: 1, maxLength: 200}
        text: {type: string, minLength: 1, maxLength: 2000}
        imageId: {type: string, minLength: 1}
        imagePosition: {type: string, enum: [left, right]}
    FeaturesProps:
      type: object
      additionalProperties: false
      required: [heading, items]
      properties:
        heading: {type: string, maxLength: 200}
        items:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [title, text, imageId]
            properties:
              title: {type: string, minLength: 1, maxLength: 120}
              text: {type: string, minLength: 1, maxLength: 500}
              imageId: {type: [string, 'null']}
    FAQProps:
      type: object
      additionalProperties: false
      required: [heading, items]
      properties:
        heading: {type: string, maxLength: 200}
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [question, answer]
            properties:
              question: {type: string, minLength: 1, maxLength: 300}
              answer: {type: string, minLength: 1, maxLength: 2000}
    CTAProps:
      type: object
      additionalProperties: false
      required: [heading, text, link]
      properties:
        heading: {type: string, minLength: 1, maxLength: 200}
        text: {type: string, maxLength: 500}
        link: {$ref: '#/components/schemas/SafeLink'}
    BuyButtonProps:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: {type: string, minLength: 1, maxLength: 80}
    PageCreateInput:
      type: object
      additionalProperties: false
      required: [type, slug, title]
      properties:
        type: {type: string, enum: [HOME, BOOK]}
        bookId: {type: [string, 'null'], format: uuid}
        slug: {type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        title: {type: string, minLength: 1, maxLength: 200}
        content: {$ref: '#/components/schemas/PageContent'}
    PublishedPage:
      type: object
      required: [id, type, bookId, slug, title, content, publishedAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [HOME, BOOK]}
        bookId: {type: [string, 'null'], format: uuid}
        slug: {type: string}
        title: {type: string}
        content: {$ref: '#/components/schemas/PageContent'}
        publishedAt: {type: [string, 'null'], format: date-time}
    AdminPage:
      type: object
      required: [id, type, bookId, slug, title, status, draftContent, publishedContent, createdAt, updatedAt, publishedAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [HOME, BOOK]}
        bookId: {type: [string, 'null'], format: uuid}
        slug: {type: string}
        title: {type: string}
        status: {type: string, enum: [DRAFT, PUBLISHED]}
        draftContent: {$ref: '#/components/schemas/PageContent'}
        publishedContent:
          oneOf:
            - $ref: '#/components/schemas/PageContent'
            - {type: 'null'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        publishedAt: {type: [string, 'null'], format: date-time}
    PageVersion:
      type: object
      required: [id, versionNumber, content, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        versionNumber: {type: integer, minimum: 1}
        content: {$ref: '#/components/schemas/PageContent'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    PageVersionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PageVersion'}
        total: {type: integer, minimum: 0}
    MediaAsset:
      type: object
      required: [id, originalFilename, mimeType, sizeBytes, width, height, url, createdAt]
      properties:
        id: {type: string, format: uuid}
        originalFilename: {type: string}
        mimeType: {type: string, enum: [image/jpeg, image/png]}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        width: {type: integer, minimum: 1, maximum: 8000}
        height: {type: integer, minimum: 1, maximum: 8000}
        url: {type: string}
        createdAt: {type: string, format: date-time}
    MediaList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MediaAsset'}
        total: {type: integer, minimum: 0}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string}
            message: {type: string}
            details: {}
  responses:
    DatabaseUnavailable:
      description: PostgreSQL no está disponible.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AuthenticationRequired:
      description: Falta una sesión válida.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AdminRequired:
      description: La sesión no corresponde al administrador.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BookNotFound:
      description: El libro no existe o no está publicado en una ruta pública.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BookSlugConflict:
      description: El slug ya pertenece a otro libro.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BookValidationFailed:
      description: Los datos del libro no cumplen el contrato.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PageNotFound:
      description: La página no existe o no está publicada en una ruta pública.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PageValidationFailed:
      description: La página o alguno de sus bloques no cumple el contrato seguro.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    MediaNotFound:
      description: La imagen no existe.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
