openapi: 3.1.0
info:
  title: Nuestra Medicina Personal API
  version: 0.1.0
  description: |
    API REST del monolito para la tienda personal de eBooks.
    Cualquier endpoint puede responder 414 con `REQUEST_URI_TOO_LONG` cuando
    la URI supera el límite configurado antes de alcanzar el router.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Health
  - name: Authentication
  - name: Books
  - name: Reviews
  - name: Newsletter
  - name: Orders
  - name: Library
  - name: Pages
  - name: Media
  - name: Webhooks
  - name: Admin books
  - name: Admin pages
  - name: Admin media
  - name: Admin reporting
  - name: Admin settings
  - name: Admin coupons
  - name: Admin reviews
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        '200':
          description: El proceso HTTP está vivo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        '200':
          description: La API puede acceder a PostgreSQL.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
  /api/v1/auth/google:
    get:
      tags: [Authentication]
      operationId: startGoogleAuthentication
      description: Inicia Authorization Code con PKCE, state y nonce.
      responses:
        '302': {description: Redirección al endpoint de autorización de Google.}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
        '503':
          description: Las credenciales Google no están configuradas.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/auth/google/callback:
    get:
      tags: [Authentication]
      operationId: completeGoogleAuthentication
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302': {description: Sesión creada y redirección a la biblioteca, o regreso al login si el usuario canceló.}
        '400':
          description: State, nonce, PKCE o callback inválido/expirado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '502':
          description: No fue posible validar la identidad con Google.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': {description: Sesión revocada y cookie eliminada.}
        '403':
          description: Origin no permitido.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Usuario de la sesión vigente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
    delete:
      tags: [Authentication]
      operationId: deleteAccount
      description: >-
        Soft-delete: anonimiza el usuario (email, nombre, foto, google_subject)
        y revoca todas sus sesiones. Órdenes, pagos y reseñas conservan su FK
        para preservar el histórico — no se borra la fila.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': {description: Cuenta anonimizada y sesión cerrada.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/books:
    get:
      tags: [Books]
      operationId: listPublishedBooks
      description: Devuelve exclusivamente libros publicados.
      responses:
        '200':
          description: Catálogo público.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookList'}
  /api/v1/books/{slug}:
    parameters:
      - $ref: '#/components/parameters/BookSlug'
    get:
      tags: [Books]
      operationId: getPublishedBook
      description: Un borrador o libro archivado se responde como inexistente.
      responses:
        '200':
          description: Libro publicado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '404': {$ref: '#/components/responses/BookNotFound'}
  /api/v1/books/{slug}/reviews:
    parameters:
      - $ref: '#/components/parameters/BookSlug'
    get:
      tags: [Reviews]
      operationId: listApprovedReviews
      description: Devuelve únicamente reseñas aprobadas de un libro publicado.
      responses:
        '200': {description: Reseñas públicas., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewList'}}}}
    post:
      tags: [Reviews]
      operationId: createReview
      description: Crea una reseña pendiente si el usuario tiene una compra pagada del libro.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewInput'}
      responses:
        '201': {description: Reseña pendiente creada., content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {description: El usuario no compró el libro., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: El usuario ya reseñó el libro., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Rating o texto inválidos., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/pages/{slug}:
    get:
      tags: [Pages]
      operationId: getPublishedPage
      description: Devuelve únicamente la versión publicada; nunca expone el borrador.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Página publicada.
          content: {application/json: {schema: {$ref: '#/components/schemas/PublishedPage'}}}
        '404': {$ref: '#/components/responses/PageNotFound'}
  /api/v1/media/{id}:
    get:
      tags: [Media]
      operationId: getMedia
      description: Sirve una imagen publicada por su UUID sin exponer el path físico.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Imagen con cache immutable.
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            image/jpeg: {}
            image/png: {}
        '404': {$ref: '#/components/responses/MediaNotFound'}
  /api/v1/me/books:
    get:
      tags: [Library]
      operationId: listPurchasedBooks
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Libros asociados a órdenes pagadas del usuario.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryBookList'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/books/{id}/download:
    get:
      tags: [Library]
      operationId: downloadPurchasedBook
      description: Autoriza la compra y delega el archivo a una ubicación interna de Nginx.
      security: [{sessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Descarga protegida resuelta internamente por Nginx.
          headers:
            Content-Disposition: {schema: {type: string}}
            X-Accel-Redirect: {schema: {type: string}}
          content:
            application/pdf: {}
            application/epub+zip: {}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404':
          description: El usuario no compró el libro o el archivo no está disponible.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
  /api/v1/newsletter/subscribe:
    post:
      tags: [Newsletter]
      operationId: subscribeNewsletter
      description: Suscribe un correo a novedades. Público e idempotente por email.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email}
                source: {type: string}
      responses:
        '204': {description: Suscripción creada o actualizada.}
        '422':
          description: Email inválido.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/me/newsletter:
    get:
      tags: [Newsletter]
      operationId: getMyNewsletterPreference
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Preferencia actual del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [subscribed]
                properties: {subscribed: {type: boolean}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
    put:
      tags: [Newsletter]
      operationId: setMyNewsletterPreference
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subscribed]
              properties: {subscribed: {type: boolean}}
      responses:
        '200':
          description: Preferencia actualizada.
          content:
            application/json:
              schema:
                type: object
                required: [subscribed]
                properties: {subscribed: {type: boolean}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      description: Crea una orden con precio histórico y una preferencia de Checkout Pro.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bookSlug]
              properties:
                bookSlug: {type: string}
                couponCode:
                  type: string
                  description: Código opcional. Se valida y descuenta server-side; nunca se confía en un precio calculado por el cliente.
      responses:
        '201':
          description: Orden pendiente con URL de Checkout Pro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
        '422':
          description: El libro no está publicado o no tiene precio válido, o el cupón no es válido (código `COUPON_INVALID`).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503':
          description: Mercado Pago no está configurado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      security: [{sessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Orden perteneciente al usuario autenticado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404':
          description: Orden inexistente o perteneciente a otro usuario.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/webhooks/mercadopago:
    post:
      tags: [Webhooks]
      operationId: processMercadoPagoWebhook
      description: Valida x-signature y reconsulta el pago; no confía en el cuerpo recibido.
      parameters:
        - {name: data.id, in: query, required: true, schema: {type: string}}
        - {name: type, in: query, schema: {type: string, const: payment}}
        - {name: X-Signature, in: header, required: true, schema: {type: string}}
        - {name: X-Request-ID, in: header, required: true, schema: {type: string}}
      responses:
        '204': {description: Notificación procesada o pago ajeno ignorado de forma segura.}
        '401':
          description: Firma ausente, inválida o vencida.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '502':
          description: Fallo transitorio al consultar o persistir el pago.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/admin/dashboard:
    get:
      tags: [Admin reporting]
      operationId: getAdminDashboard
      security: [{sessionCookie: []}]
      description: Métricas agregadas. Ingresos y ticket promedio consideran únicamente órdenes pagadas en la moneda solicitada.
      parameters:
        - {$ref: '#/components/parameters/ReportingRange'}
        - {$ref: '#/components/parameters/ReportingBookSlug'}
        - {$ref: '#/components/parameters/ReportingCurrency'}
      responses:
        '200': {description: Resumen del backoffice., content: {application/json: {schema: {$ref: '#/components/schemas/AdminDashboard'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '422': {$ref: '#/components/responses/BackofficeQueryInvalid'}
  /api/v1/admin/sales:
    get:
      tags: [Admin reporting]
      operationId: listAdminSales
      security: [{sessionCookie: []}]
      description: Lista órdenes con el título e importe históricos y estados de orden y pago separados.
      parameters:
        - {$ref: '#/components/parameters/ReportingRange'}
        - {$ref: '#/components/parameters/ReportingBookSlug'}
        - name: status
          in: query
          schema: {type: string, enum: [APPROVED, PENDING, REJECTED, REFUNDED, CANCELLED, EXPIRED]}
        - {name: query, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageOffset'}
      responses:
        '200': {description: Página de ventas., content: {application/json: {schema: {$ref: '#/components/schemas/AdminSalesPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '422': {$ref: '#/components/responses/BackofficeQueryInvalid'}
  /api/v1/admin/customers:
    get:
      tags: [Admin reporting]
      operationId: listAdminCustomers
      security: [{sessionCookie: []}]
      description: Lista clientes y sus compras pagadas; excluye la cuenta administradora configurada.
      parameters:
        - {name: query, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/ReportingCurrency'}
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageOffset'}
      responses:
        '200': {description: Página de clientes., content: {application/json: {schema: {$ref: '#/components/schemas/AdminCustomersPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '422': {$ref: '#/components/responses/BackofficeQueryInvalid'}
  /api/v1/admin/settings:
    get:
      tags: [Admin settings]
      operationId: getAdminSettings
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Configuración editorial y estado de integraciones., content: {application/json: {schema: {$ref: '#/components/schemas/SiteSettings'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
    put:
      tags: [Admin settings]
      operationId: updateAdminSettings
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteSettingsInput'}
      responses:
        '200': {description: Configuración actualizada., content: {application/json: {schema: {$ref: '#/components/schemas/SiteSettings'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
        '422': {$ref: '#/components/responses/SettingsValidationFailed'}
  /api/v1/admin/books:
    get:
      tags: [Admin books]
      operationId: listAdminBooks
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Todos los libros, incluidos borradores y archivados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookList'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
    post:
      tags: [Admin books]
      operationId: createBook
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '201':
          description: Libro creado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/BookConflict'}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
        '422': {$ref: '#/components/responses/BookValidationFailed'}
  /api/v1/admin/books/{identifier}:
    parameters:
      - $ref: '#/components/parameters/BookIdentifier'
    get:
      tags: [Admin books]
      operationId: getAdminBook
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Libro por UUID o slug.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
    put:
      tags: [Admin books]
      operationId: updateBook
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '200':
          description: Libro actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '409': {$ref: '#/components/responses/BookConflict'}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
        '422': {$ref: '#/components/responses/BookValidationFailed'}
    delete:
      tags: [Admin books]
      operationId: archiveBook
      description: Cambia el estado a ARCHIVED; no elimina registros físicamente.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': {description: Libro archivado.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
  /api/v1/admin/pages:
    post:
      tags: [Admin pages]
      operationId: createPage
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PageCreateInput'}}}
      responses:
        '201':
          description: Página creada como borrador.
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {description: El slug o destino de la página ya existe., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
        '422': {$ref: '#/components/responses/PageValidationFailed'}
  /api/v1/admin/pages/{identifier}:
    get:
      tags: [Admin pages]
      operationId: getAdminPage
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
      responses:
        '200': {description: Página con borrador y publicación., content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/PageNotFound'}
  /api/v1/admin/pages/{identifier}/draft:
    put:
      tags: [Admin pages]
      operationId: savePageDraft
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: {$ref: '#/components/schemas/PageContent'}
      responses:
        '200': {description: Borrador guardado sin cambiar la publicación., content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/PageNotFound'}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
        '422': {$ref: '#/components/responses/PageValidationFailed'}
  /api/v1/admin/pages/{identifier}/publish:
    post:
      tags: [Admin pages]
      operationId: publishPage
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200': {description: Borrador publicado como una nueva versión inmutable., content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/PageNotFound'}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
  /api/v1/admin/pages/{identifier}/versions:
    get:
      tags: [Admin pages]
      operationId: listPageVersions
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
      responses:
        '200': {description: Historial descendente de publicaciones., content: {application/json: {schema: {$ref: '#/components/schemas/PageVersionList'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/PageNotFound'}
  /api/v1/admin/pages/{identifier}/versions/{versionId}/restore:
    post:
      tags: [Admin pages]
      operationId: restorePageVersion
      description: Copia una versión al borrador; no cambia el contenido público hasta volver a publicar.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/PageIdentifier'
        - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Origin'
      responses:
        '200': {description: Versión restaurada como borrador., content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {description: Página o versión inexistente., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
  /api/v1/admin/coupons:
    get:
      tags: [Admin coupons]
      operationId: listAdminCoupons
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Cupones con estado efectivo calculado por el servidor., content: {application/json: {schema: {$ref: '#/components/schemas/CouponList'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
    post:
      tags: [Admin coupons]
      operationId: createAdminCoupon
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CouponInput'}}}}
      responses:
        '201': {description: Cupón creado., content: {application/json: {schema: {$ref: '#/components/schemas/Coupon'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {description: Código duplicado., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Datos inválidos., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/admin/coupons/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Admin coupons]
      operationId: updateAdminCoupon
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CouponInput'}}}}
      responses:
        '200': {description: Cupón actualizado., content: {application/json: {schema: {$ref: '#/components/schemas/Coupon'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {description: Cupón inexistente., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Código duplicado., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Datos inválidos., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Admin coupons]
      operationId: deleteAdminCoupon
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/Origin'}]
      responses:
        '204': {description: Cupón eliminado.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {description: Cupón inexistente., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/admin/reviews:
    get:
      tags: [Admin reviews]
      operationId: listAdminReviews
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Todas las reseñas para moderación., content: {application/json: {schema: {$ref: '#/components/schemas/ReviewList'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
  /api/v1/admin/reviews/{id}/status:
    put:
      tags: [Admin reviews]
      operationId: moderateAdminReview
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Origin'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewStatusInput'}}}}
      responses:
        '200': {description: Reseña moderada., content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {description: Reseña inexistente., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Estado inválido., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/admin/reviews/{id}:
    delete:
      tags: [Admin reviews]
      operationId: deleteAdminReview
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': {description: Reseña eliminada.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {description: Reseña inexistente., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/admin/media:
    get:
      tags: [Admin media]
      operationId: listMedia
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Biblioteca multimedia., content: {application/json: {schema: {$ref: '#/components/schemas/MediaList'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
    post:
      tags: [Admin media]
      operationId: uploadMedia
      description: Valida extensión, MIME, contenido y dimensiones antes de guardar la imagen.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: Imagen guardada., content: {application/json: {schema: {$ref: '#/components/schemas/MediaAsset'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '413': {description: La imagen supera el límite configurado., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
        '422': {description: El archivo no es una imagen JPEG/PNG válida., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/admin/media/{id}:
    delete:
      tags: [Admin media]
      operationId: deleteMedia
      description: Rechaza la eliminación si una portada o versión de página todavía referencia la imagen.
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': {description: Imagen y metadata eliminadas.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/MediaNotFound'}
        '409': {description: La imagen todavía está referenciada., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
  /api/v1/admin/books/{identifier}/ebook:
    parameters:
      - $ref: '#/components/parameters/BookIdentifier'
    put:
      tags: [Admin books]
      operationId: uploadBookEbook
      description: Reemplaza el archivo privado del libro después de validar extensión, MIME y contenido.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Archivo almacenado con una clave física opaca.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EbookUpload'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '413':
          description: El archivo supera el límite configurado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429': {$ref: '#/components/responses/RateLimitExceeded'}
        '422':
          description: El archivo no es un PDF o EPUB válido.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/admin/books/{identifier}/manuscript:
    parameters:
      - $ref: '#/components/parameters/BookIdentifier'
    get:
      tags: [Admin books]
      operationId: getBookManuscript
      description: 'Sin manuscrito guardado todavía, responde con `chapters: []` en vez de 404.'
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Manuscrito actual del libro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Manuscript'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
    put:
      tags: [Admin books]
      operationId: saveBookManuscript
      description: Reemplaza los capítulos completos (autosave del editor). Como máximo 200 capítulos, 2MB de HTML cada uno.
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [chapters]
              properties:
                chapters:
                  type: array
                  items: {$ref: '#/components/schemas/ManuscriptChapter'}
      responses:
        '200':
          description: Manuscrito guardado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Manuscript'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '422':
          description: Demasiados capítulos o un capítulo demasiado grande.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/admin/books/{identifier}/manuscript/import:
    parameters:
      - $ref: '#/components/parameters/BookIdentifier'
    put:
      tags: [Admin books]
      operationId: importBookManuscript
      description: >-
        Convierte un archivo subido (.txt/.docx/.pdf) en un solo capítulo y lo
        persiste de inmediato. Extensión y firma de bytes se validan antes de
        convertir (ADR 0004).
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Manuscrito reemplazado por el contenido convertido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Manuscript'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '413':
          description: El archivo supera el límite configurado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '415':
          description: Extensión no soportada (código `MANUSCRIPT_UNSUPPORTED_FORMAT`).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: Extensión válida pero el archivo no pudo convertirse (código `MANUSCRIPT_CONVERSION_FAILED`).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/admin/books/{identifier}/manuscript/export:
    parameters:
      - $ref: '#/components/parameters/BookIdentifier'
    get:
      tags: [Admin books]
      operationId: exportBookManuscript
      description: >-
        Genera EPUB o PDF a partir de los capítulos guardados y lo devuelve
        como descarga. Nunca reemplaza el ebook vendible del libro (ADR 0004).
      security: [{sessionCookie: []}]
      parameters:
        - name: format
          in: query
          required: true
          schema: {type: string, enum: [epub, pdf]}
      responses:
        '200':
          description: Archivo generado.
          content:
            application/epub+zip: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/BookNotFound'}
        '415':
          description: Formato no soportado (código `MANUSCRIPT_UNSUPPORTED_FORMAT`).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nmp_session
  parameters:
    BookSlug:
      name: slug
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    BookIdentifier:
      name: identifier
      in: path
      required: true
      description: UUID o slug del libro.
      schema: {type: string}
    PageIdentifier:
      name: identifier
      in: path
      required: true
      description: UUID o slug de la página.
      schema: {type: string}
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
    ReportingRange:
      name: range
      in: query
      schema: {type: string, enum: [7d, 30d, year, all], default: year}
    ReportingBookSlug:
      name: bookSlug
      in: query
      schema: {type: string}
    ReportingCurrency:
      name: currency
      in: query
      schema: {type: string, minLength: 3, maxLength: 3, default: ARS}
    PageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    PageOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    BookStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    User:
      type: object
      required: [id, email, displayName, pictureUrl, isAdmin]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        pictureUrl: {type: string}
        isAdmin: {type: boolean}
    OrderStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED, EXPIRED]
    OrderItem:
      type: object
      required: [bookId, bookSlug, bookTitle, unitPriceMinorUnits, quantity, currency]
      properties:
        bookId: {type: string, format: uuid}
        bookSlug: {type: string}
        bookTitle: {type: string}
        unitPriceMinorUnits: {type: integer, format: int64, minimum: 0}
        quantity: {type: integer, minimum: 1}
        currency: {type: string, minLength: 3, maxLength: 3}
    Order:
      type: object
      required: [id, status, totalMinorUnits, currency, items, createdAt, updatedAt, paidAt]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/OrderStatus'}
        totalMinorUnits: {type: integer, format: int64, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3}
        checkoutUrl: {type: string, format: uri}
        couponCode:
          type: string
          description: Código del cupón aplicado, como snapshot histórico — no cambia si el cupón se edita o borra después.
        discountMinorUnits: {type: integer, format: int64, minimum: 0}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        paidAt: {type: [string, 'null'], format: date-time}
    ReportingDisplayStatus:
      type: string
      enum: [APPROVED, PENDING, REJECTED, REFUNDED, CANCELLED, EXPIRED]
    AdminSale:
      type: object
      required: [id, createdAt, paidAt, customerId, customerName, customerEmail, bookId, bookSlug, bookTitle, amountMinorUnits, currency, orderStatus, paymentStatus, paymentProvider, providerPaymentId, displayStatus]
      properties:
        id: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        paidAt: {type: [string, 'null'], format: date-time}
        customerId: {type: string, format: uuid}
        customerName: {type: string}
        customerEmail: {type: string, format: email}
        bookId: {type: string, format: uuid}
        bookSlug: {type: string}
        bookTitle: {type: string, description: Título histórico guardado en el item de la orden.}
        amountMinorUnits: {type: integer, format: int64, minimum: 0, description: Importe histórico de la orden; nunca se deriva del precio actual del libro.}
        currency: {type: string, minLength: 3, maxLength: 3}
        orderStatus: {$ref: '#/components/schemas/OrderStatus'}
        paymentStatus: {type: [string, 'null'], enum: [PENDING, APPROVED, REJECTED, CANCELLED, REFUNDED, null]}
        paymentProvider: {type: [string, 'null']}
        providerPaymentId: {type: [string, 'null']}
        displayStatus: {$ref: '#/components/schemas/ReportingDisplayStatus'}
    AdminSalesPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminSale'}}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
    AdminPurchasedBook:
      type: object
      required: [id, slug, title, purchasedAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        purchasedAt: {type: string, format: date-time}
    AdminCustomer:
      type: object
      required: [id, displayName, email, pictureUrl, createdAt, lastLoginAt, paidOrdersCount, booksPurchasedCount, totalSpentMinorUnits, currency, lastPurchaseAt, purchasedBooks]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string}
        email: {type: string, format: email}
        pictureUrl: {type: [string, 'null'], format: uri}
        createdAt: {type: string, format: date-time}
        lastLoginAt: {type: [string, 'null'], format: date-time}
        paidOrdersCount: {type: integer, minimum: 0}
        booksPurchasedCount: {type: integer, minimum: 0}
        totalSpentMinorUnits: {type: integer, format: int64, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3}
        lastPurchaseAt: {type: [string, 'null'], format: date-time}
        purchasedBooks: {type: array, items: {$ref: '#/components/schemas/AdminPurchasedBook'}}
    AdminCustomersPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminCustomer'}}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
    AdminTrendPoint:
      type: object
      required: [periodStart, salesCount, revenueMinorUnits]
      properties:
        periodStart: {type: string, format: date-time}
        salesCount: {type: integer, minimum: 0}
        revenueMinorUnits: {type: integer, format: int64, minimum: 0}
    AdminBookMetric:
      type: object
      required: [bookId, bookSlug, bookTitle, salesCount, revenueMinorUnits]
      properties:
        bookId: {type: string, format: uuid}
        bookSlug: {type: string}
        bookTitle: {type: string}
        salesCount: {type: integer, minimum: 0}
        revenueMinorUnits: {type: integer, format: int64, minimum: 0}
    AdminStatusMetric:
      type: object
      required: [status, count]
      properties:
        status: {$ref: '#/components/schemas/ReportingDisplayStatus'}
        count: {type: integer, minimum: 0}
    AdminDashboard:
      type: object
      required: [range, currency, kpis, books, trend, topBooks, paymentStatuses, recentSales, generatedAt]
      properties:
        range: {type: string, enum: [7d, 30d, year, all]}
        currency: {type: string, minLength: 3, maxLength: 3}
        kpis:
          type: object
          required: [approvedSalesCount, revenueMinorUnits, buyersCount, averageOrderMinorUnits]
          properties:
            approvedSalesCount: {type: integer, minimum: 0}
            revenueMinorUnits: {type: integer, format: int64, minimum: 0}
            buyersCount: {type: integer, minimum: 0}
            averageOrderMinorUnits: {type: integer, format: int64, minimum: 0}
        books:
          type: object
          required: [publishedCount, draftCount]
          properties:
            publishedCount: {type: integer, minimum: 0}
            draftCount: {type: integer, minimum: 0}
        trend: {type: array, items: {$ref: '#/components/schemas/AdminTrendPoint'}}
        topBooks: {type: array, items: {$ref: '#/components/schemas/AdminBookMetric'}}
        paymentStatuses: {type: array, items: {$ref: '#/components/schemas/AdminStatusMetric'}}
        recentSales: {type: array, items: {$ref: '#/components/schemas/AdminSale'}}
        generatedAt: {type: string, format: date-time}
    BookInput:
      type: object
      additionalProperties: false
      required: [slug, title, priceMinorUnits]
      properties:
        slug: {type: string, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        title: {type: string, maxLength: 200}
        subtitle: {type: string}
        authorName: {type: string}
        category: {type: string}
        variant: {type: string, enum: [gold, blue], default: blue}
        shortDescription: {type: string, maxLength: 1000}
        priceMinorUnits: {type: integer, format: int64, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3, default: ARS}
        isbn: {type: string}
        publicationDate: {type: [string, 'null'], format: date}
        publicationDateLabel: {type: string}
        format: {type: string}
        fileSizeBytes: {type: [integer, 'null'], format: int64, minimum: 0}
        coverMediaId: {type: [string, 'null'], format: uuid}
        coverCaption: {type: string}
        status: {$ref: '#/components/schemas/BookStatus'}
        seoTitle: {type: string}
        seoDescription: {type: string}
        seoIndexable: {type: boolean, default: true}
    Book:
      allOf:
        - $ref: '#/components/schemas/BookInput'
        - type: object
          required: [id, status, hasCover, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            hasCover: {type: boolean}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            publishedAt: {type: [string, 'null'], format: date-time}
    BookList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Book'}
        total: {type: integer, minimum: 0}
    LibraryBook:
      type: object
      required: [id, slug, title, format, purchasedAt, downloadAvailable]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        coverMediaId: {type: [string, 'null'], format: uuid}
        format: {type: string}
        fileSizeBytes: {type: [integer, 'null'], format: int64, minimum: 0}
        purchasedAt: {type: string, format: date-time}
        downloadAvailable: {type: boolean}
    LibraryBookList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryBook'}
        total: {type: integer, minimum: 0}
    EbookUpload:
      type: object
      required: [bookId, filename, mediaType, sizeBytes]
      properties:
        bookId: {type: string, format: uuid}
        filename: {type: string}
        mediaType: {type: string, enum: [application/pdf, application/epub+zip]}
        sizeBytes: {type: integer, format: int64, minimum: 1}
    ManuscriptChapter:
      type: object
      required: [id, title, html]
      properties:
        id: {type: integer}
        title: {type: string}
        html: {type: string, maxLength: 8388608}
        kind:
          type: string
          enum: [COVER, DEDICATION, PROLOGUE, INTRODUCTION, CHAPTER, EPILOGUE, ACKNOWLEDGMENTS, APPENDIX, CUSTOM]
          description: 'What this section is in the finished book, beyond just "a chapter" — a portada, a prólogo, an epílogo, etc. An empty/omitted value is treated as CHAPTER (manuscripts saved before this field existed).'
        titleMode:
          type: string
          enum: [AUTO, CUSTOM]
          description: 'Whether `title` is the kind''s auto-generated label or text the author typed themselves — the editor uses this only to restore the right toggle state on reload; `title` itself always already holds the resolved, literal heading text. An empty/omitted value is treated as AUTO.'
    Manuscript:
      type: object
      required: [bookId, chapters]
      properties:
        bookId: {type: string, format: uuid}
        chapters:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/ManuscriptChapter'}
        updatedAt: {type: [string, 'null'], format: date-time}
    SiteSettingsInput:
      type: object
      additionalProperties: false
      required: [siteName, siteDescription, supportEmail, newsletterEmail, senderName, seoTitle, seoDescription, seoIndexable]
      properties:
        siteName: {type: string, minLength: 1, maxLength: 200}
        siteDescription: {type: string, maxLength: 500}
        supportEmail: {type: string, format: email, maxLength: 320}
        newsletterEmail: {type: string, format: email, maxLength: 320}
